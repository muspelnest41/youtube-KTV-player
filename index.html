<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Player Ultra - 統計時長版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f1f5f9; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 0.75rem; background: #000; }
        .video-container iframe, .video-placeholder, .music-mode-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .ghost-card { opacity: 0.5; background: #334155 !important; }
        .vinyl-spin { animation: spin 15s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .vinyl-paused { animation-play-state: paused; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 border-b border-slate-700 pb-6">
            <h1 class="text-3xl font-bold mb-6 flex items-center gap-3 text-white">
                <i class="fab fa-youtube text-red-500 text-4xl"></i> YouTube Player Ultra
            </h1>
            <div class="flex flex-col lg:flex-row gap-4 bg-slate-800/50 p-4 rounded-xl border border-slate-700 shadow-xl">
                <input type="text" id="videoInput" class="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 outline-none text-white" placeholder="請貼上影片網址...">
                <button id="loadBtn" class="bg-red-600 hover:bg-red-700 px-6 rounded-lg font-bold">載入影片</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 xl:col-span-8">
                <div class="video-container shadow-2xl border border-slate-700">
                    <div id="player"></div>
                </div>
            </div>

            <div class="lg:col-span-5 xl:col-span-4">
                <div class="bg-slate-800 rounded-2xl border border-slate-700 flex flex-col h-[700px]">
                    <!-- 統計資訊與進度 -->
                    <div class="p-4 border-b border-slate-700 bg-slate-900/50">
                        <div id="playbackTimer" class="text-sm font-mono text-sky-400 mb-2">請開始播放...</div>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="bg-slate-700 p-2 rounded">佇列時長(灰+藍): <span id="queueTime" class="font-bold">0:00</span></div>
                            <div class="bg-slate-700 p-2 rounded">全部統計: <span id="totalTime" class="font-bold">0:00</span></div>
                        </div>
                    </div>
                    
                    <div id="playlist" class="flex-grow overflow-y-auto p-4 space-y-3 custom-scrollbar"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let playlist = [];
        let player = null;
        let currentIndex = -1;

        // 格式化秒數
        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                events: { 'onStateChange': (e) => { if(e.data === 0) playNext(); } }
            });
        }

        // 定時更新進度
        setInterval(() => {
            if (player && player.getCurrentTime) {
                const current = player.getCurrentTime();
                const duration = player.getDuration();
                if (duration > 0) {
                    const remaining = duration - current;
                    document.getElementById('playbackTimer').innerText = 
                        `${currentIndex + 1}: ${playlist[currentIndex].title.substring(0,10)}... | ${formatTime(current)}/${formatTime(duration)}/${formatTime(remaining)}`;
                }
            }
            updateStats();
        }, 1000);

        function updateStats() {
            let queue = 0; // 灰 + 藍
            let total = 0; // 灰 + 藍 + 紅
            playlist.forEach(v => {
                const s = v.duration || 0;
                total += s;
                if (v.ghostState !== 'stealth') queue += s;
            });
            document.getElementById('queueTime').innerText = formatTime(queue);
            document.getElementById('totalTime').innerText = formatTime(total);
        }

        function addToPlaylist(ytId) {
            const newItem = {
                id: Date.now().toString(),
                youtubeId: ytId,
                title: "載入中...",
                ghostState: 'once',
                duration: 0
            };
            
            // 模擬獲取時長 (實際可用 Data API 獲取 contentDetails.duration)
            // 這裡先設為預設值，實際應用建議串接 Youtube API
            newItem.duration = Math.floor(Math.random() * 300) + 60; 
            
            playlist.push(newItem);
            renderPlaylist();
        }

        function renderPlaylist() {
            const list = document.getElementById('playlist');
            list.innerHTML = playlist.map((v, i) => `
                <div class="p-3 bg-slate-900 rounded border border-slate-700 flex justify-between items-center">
                    <span>${v.title} (${formatTime(v.duration)})</span>
                    <span class="text-xs text-slate-500">${v.ghostState}</span>
                </div>
            `).join('');
        }

        document.getElementById('loadBtn').onclick = () => {
            const url = document.getElementById('videoInput').value;
            const id = url.split('v=')[1]?.substring(0,11);
            if(id) addToPlaylist(id);
        };
    </script>
</body>
</html>
