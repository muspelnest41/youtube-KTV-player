<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Player Ultra - 功能全還原版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f1f5f9; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 0.75rem; background: #000; }
        .video-container iframe, .video-placeholder, .music-mode-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .vinyl-spin { animation: spin 15s linear infinite; }
        .vinyl-paused { animation-play-state: paused; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 border-b border-slate-700 pb-6">
            <h1 class="text-3xl font-bold mb-6 flex items-center gap-3 text-white">
                <i class="fab fa-youtube text-red-500 text-4xl"></i> YouTube Player Ultra
            </h1>
            <div class="flex flex-col lg:flex-row gap-4 bg-slate-800/50 p-4 rounded-xl border border-slate-700 shadow-xl">
                <input type="text" id="videoInput" class="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 outline-none text-white" placeholder="請貼上影片網址...">
                <button id="loadBtn" class="bg-red-600 hover:bg-red-700 px-6 rounded-lg font-bold">載入影片</button>
                <button id="musicModeToggle" class="bg-slate-700 px-6 rounded-lg font-bold text-slate-300">🎧 純享模式: 關</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 xl:col-span-8">
                <div class="video-container shadow-2xl border border-slate-700">
                    <div id="player"></div>
                    <div id="musicModeOverlay" class="music-mode-overlay flex-col items-center justify-center bg-slate-950/95 hidden z-10">
                        <div id="vinylRecord" class="w-48 h-48 rounded-full bg-neutral-900 border-4 border-neutral-800 flex items-center justify-center vinyl-spin vinyl-paused">
                            <img id="vinylCover" src="" class="w-16 h-16 rounded-full object-cover">
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-5 xl:col-span-4">
                <div class="bg-slate-800 rounded-2xl border border-slate-700 flex flex-col h-[700px]">
                    <div class="p-4 border-b border-slate-700 bg-slate-900/50 text-xs">
                        <div id="playbackTimer" class="font-mono text-sky-400 mb-2 font-bold">目前無播放</div>
                        <div class="grid grid-cols-2 gap-2 text-[10px]">
                            <div class="bg-slate-700 p-2 rounded">佇列(灰+藍): <span id="queueTime" class="text-blue-400 font-bold">0:00</span></div>
                            <div class="bg-slate-700 p-2 rounded">全部統計: <span id="totalTime" class="text-red-400 font-bold">0:00</span></div>
                        </div>
                    </div>
                    <div id="playlist" class="flex-grow overflow-y-auto p-4 space-y-3 custom-scrollbar"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let playlist = [];
        let player = null;
        let currentIndex = -1;
        let isMusicMode = false;

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', { 
                height: '100%', width: '100%', 
                events: { 'onStateChange': e => {
                    document.getElementById('vinylRecord').classList.toggle('vinyl-paused', e.data !== 1);
                    if (e.data === 0) playNext();
                }}
            });
        }

        setInterval(() => {
            if (player && player.getCurrentTime && currentIndex !== -1) {
                const current = player.getCurrentTime();
                const duration = player.getDuration();
                if (duration > 0) {
                    document.getElementById('playbackTimer').innerText = `${currentIndex + 1}. | ${formatTime(current)}/${formatTime(duration)}`;
                }
            }
            updateStats();
        }, 1000);

        function updateStats() {
            let queue = 0, total = 0;
            playlist.forEach(v => {
                total += v.duration;
                if (v.ghostState !== 'stealth') queue += v.duration;
            });
            document.getElementById('queueTime').innerText = formatTime(queue);
            document.getElementById('totalTime').innerText = formatTime(total);
        }

        function playNext() {
            if(playlist.length === 0) return;
            currentIndex = (currentIndex + 1) % playlist.length;
            player.loadVideoById(playlist[currentIndex].youtubeId);
            renderPlaylist();
        }

        function addToPlaylist(ytId) {
            playlist.push({
                id: Date.now().toString(),
                youtubeId: ytId,
                title: "影片載入中...",
                ghostState: 'once',
                random: false,
                duration: 240
            });
            renderPlaylist();
            if(currentIndex === -1) playNext();
        }

        function renderPlaylist() {
            const list = document.getElementById('playlist');
            list.innerHTML = playlist.map((v, i) => `
                <div class="p-3 bg-slate-900 rounded border border-slate-700 flex justify-between items-center ${i === currentIndex ? 'ring-2 ring-blue-500' : ''}">
                    <span class="text-xs truncate w-24">${v.title}</span>
                    <div class="flex gap-1">
                        <button onclick="toggleGhost('${v.id}')" class="text-sm p-2 rounded ${v.ghostState === 'once' ? 'text-blue-400' : v.ghostState === 'stealth' ? 'text-red-400' : 'text-slate-400'}">
                            <i class="fas fa-ghost"></i>
                        </button>
                        <button onclick="toggleRandom('${v.id}')" class="text-sm p-2 rounded ${v.random ? 'text-green-400' : 'text-slate-600'}">
                            <i class="fas fa-random"></i>
                        </button>
                        <button onclick="removeVideo('${v.id}')" class="text-sm p-2 text-slate-500 hover:text-red-400">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function toggleGhost(id) {
            const v = playlist.find(x => x.id === id);
            v.ghostState = v.ghostState === 'once' ? 'keep' : v.ghostState === 'keep' ? 'stealth' : 'once';
            renderPlaylist();
        }

        function toggleRandom(id) {
            const v = playlist.find(x => x.id === id);
            v.random = !v.random;
            renderPlaylist();
        }

        function removeVideo(id) {
            playlist = playlist.filter(x => x.id !== id);
            renderPlaylist();
        }

        document.getElementById('loadBtn').onclick = () => {
            const id = document.getElementById('videoInput').value.split('v=')[1]?.substring(0,11);
            if(id) addToPlaylist(id);
        };

        document.getElementById('musicModeToggle').onclick = () => {
            isMusicMode = !isMusicMode;
            document.getElementById('musicModeOverlay').classList.toggle('hidden', !isMusicMode);
            document.getElementById('musicModeOverlay').classList.toggle('flex', isMusicMode);
        };
    </script>
</body>
</html>
